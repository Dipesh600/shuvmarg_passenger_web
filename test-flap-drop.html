<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.orange-grid-bg {
  background-color: #ff7828;
  background-image: linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
  background-size: 14px 14px;
}
</style>
</head>
<body class="bg-gray-200 p-20 flex justify-center items-center h-screen">

<div class="relative group w-[400px] h-[240px] cursor-pointer">
  
  <!-- Orange card with drop-shadow instead of box-shadow -->
  <div class="absolute inset-0 rounded-2xl rotate-[-2deg] transition-transform duration-300 drop-shadow-xl z-0">
     <!-- We need an inner div for the background so drop-shadow applies correctly -->
     <div class="absolute inset-0 orange-grid-bg rounded-2xl"></div>

    <!-- The physical sliding tab -->
    <!-- It has no shadow itself. The drop-shadow of the parent outlines it! -->
    <!-- Let's make it a wide tab -->
    <div class="absolute bottom-4 left-6 right-6 translate-y-0 group-hover:translate-y-[48px] transition-transform duration-[500ms] ease-[cubic-bezier(0.2,0.8,0.2,1)] orange-grid-bg text-white text-[11px] font-bold uppercase tracking-widest px-10 pt-10 pb-3 rounded-b-2xl flex flex-col items-center justify-end -z-10">
      
      <!-- A little dashed line to look like a tear-off or fold -->
      <div class="absolute top-[20px] left-4 right-4 h-px border-t border-dashed border-white/30"></div>

      <span class="relative z-10 flex items-center gap-2">
         View Details
         <svg class="w-3 h-3 group-hover:translate-y-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
         </svg>
      </span>
    </div>
  </div>
  
  <!-- White card -->
  <div class="relative bg-white rounded-2xl h-full p-6 z-10 shadow-md">
     <h1 class="text-3xl font-bold">Main Card</h1>
     <p>Hover me to see the magic drop-shadow!</p>
  </div>
</div>

</body>
</html>
